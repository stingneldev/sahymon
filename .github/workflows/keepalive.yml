# Mantém o projeto gratuito do Supabase ativo: ele é pausado após 7 dias sem acesso.
# A cada 3 dias chama a função keepalive() (supabase/schema.sql), que só responde 1.
# A URL e a chave pública são lidas do config.js, então não há nada para configurar.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"   # a cada 3 dias, 09:00 em Brasília
  workflow_dispatch:          # permite rodar à mão na aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Chamar o Supabase
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js ainda sem Supabase configurado; nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase respondeu: projeto ativo."
